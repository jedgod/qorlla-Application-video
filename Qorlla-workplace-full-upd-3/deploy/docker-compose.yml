version: '3'
services:
  backend:
    build: ../backend
    env_file: ../backend/.env
    volumes:
      - ../backend/data:/app/data
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
