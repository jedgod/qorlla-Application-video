services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qorlla_voice_test
      POSTGRES_USER: qorlla_voice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U qorlla_voice -d qorlla_voice_test']
      interval: 5s
      retries: 12
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    command: ['redis-server','--requirepass','${REDIS_PASSWORD:?set REDIS_PASSWORD}','--appendonly','yes']
    healthcheck:
      test: ['CMD-SHELL','redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  voice-a:
    build: ..
    environment: &voice-env
      DATABASE_URL: postgres://qorlla_voice:${POSTGRES_PASSWORD}@postgres:5432/qorlla_voice_test
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 4600
    depends_on: [postgres,redis]
  voice-b:
    build: ..
    environment: *voice-env
    depends_on: [postgres,redis]
volumes:
  pgdata:
