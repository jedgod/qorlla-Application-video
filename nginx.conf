server {
    listen 80;
    root /usr/share/nginx/html;
    # The Workplace home page is the entry point; it links on to index.html (video page)
    index qorlla.html;
    client_max_body_size 10m;

    # API and websockets go to the Node backend so cookies and sockets stay same-origin
    location /api/ {
        proxy_pass http://workspace-signaling-engine:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://workspace-signaling-engine:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
