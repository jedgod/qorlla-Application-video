# Public reverse proxy. Plain HTTP (:80 / :81) never serves the application.
# HTTPS MAIN (:443) and Meet (:444) live in deploy/nginx/tls.conf.
# docker-compose.yml requires an explicit reviewed PROXY_TLS_CONF.
server {
    listen 80;
    default_type text/plain;
    return 426 "HTTPS is required. Use the configured secure public URL.\n";
}
server {
    listen 81;
    default_type text/plain;
    return 426 "HTTPS is required. Use the configured secure Meet URL.\n";
}
