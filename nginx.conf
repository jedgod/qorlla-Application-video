# Public reverse proxy.
#   :80  MAIN (workplace, chat)        :81  Qorlla Meet
# TLS twins (:443 / :444) live in deploy/nginx/tls.conf and are enabled by PROXY_TLS_CONF in docker-compose.yml.
server {
    listen 80;
    include /etc/nginx/snippets/main-locations.conf;
}
server {
    listen 81;
    include /etc/nginx/snippets/meet-locations.conf;
}
