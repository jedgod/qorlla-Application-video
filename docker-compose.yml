services:
  workspace-signaling-engine:
    container_name: zoom_core_backend_instance
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Optional. Put real values in a .env file next to this one (see .env.example).
      - PUBLIC_URL=${PUBLIC_URL:-}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-}
      - ENCRYPT_KEY_OLD=${ENCRYPT_KEY_OLD:-}
      - SMTP_URL=${SMTP_URL:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - MAIL_DAILY_LIMIT=${MAIL_DAILY_LIMIT:-20}
      - CHAT_MAX_MESSAGES=${CHAT_MAX_MESSAGES:-500}
      - DATABASE_URL=postgres://qorlla_app:${QORLLA_APP_DB_PASSWORD}@main-db:5432/qorlla_main
      - QORLLA_BRIDGE_SECRET=${QORLLA_BRIDGE_SECRET:-}
      - MEET_BASE_URL=${MEET_BASE_URL:-http://host.docker.internal:3000}
      - MEET_PUBLIC_URL=${MEET_PUBLIC_URL:-}
    depends_on:
      main-db:
        condition: service_healthy
    volumes:
      - workspace-data:/usr/src/app/data
    restart: always
    networks:
      - cluster-mesh-network

  main-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qorlla_main
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:?set MAIN_DB_PASSWORD in .env}
      POSTGRES_DB: qorlla_main
      QORLLA_APP_DB_PASSWORD: ${QORLLA_APP_DB_PASSWORD:?set QORLLA_APP_DB_PASSWORD in .env}
    volumes:
      - main-db-data:/var/lib/postgresql/data
      - ./meet-sync/sql/001.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./meet-sync/sql/002_recovery.sql:/docker-entrypoint-initdb.d/002_recovery.sql:ro
      - ./meet-sync/sql/003_passcode.sql:/docker-entrypoint-initdb.d/003_passcode.sql:ro
      - ./meet-sync/sql/004_ack_retry.sql:/docker-entrypoint-initdb.d/004_ack_retry.sql:ro
      - ./meet-sync/sql/005_roles.sh:/docker-entrypoint-initdb.d/005_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorlla_main"]
      interval: 5s
      retries: 10
    restart: always
    networks:
      - cluster-mesh-network

  meet-sync-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "meet-sync/src/worker.mjs"]
    healthcheck:
      disable: true # the image healthcheck probes the web port, which the worker does not serve
    environment:
      - DATABASE_URL=postgres://qorlla_app:${QORLLA_APP_DB_PASSWORD}@main-db:5432/qorlla_main
      - MEET_BASE_URL=${MEET_BASE_URL:-http://host.docker.internal:3000}
      - QORLLA_BRIDGE_SECRET=${QORLLA_BRIDGE_SECRET:-}
      - QORLLA_VAULT_KEY=${QORLLA_VAULT_KEY:-}
      - MEET_SYNC_LEASE_SECONDS=${MEET_SYNC_LEASE_SECONDS:-90}
      - MEET_SYNC_BACKOFF_BASE_SECONDS=${MEET_SYNC_BACKOFF_BASE_SECONDS:-5}
      - MEET_SYNC_ACK_BACKOFF_BASE_SECONDS=${MEET_SYNC_ACK_BACKOFF_BASE_SECONDS:-5}
    depends_on:
      main-db:
        condition: service_healthy
    restart: always
    networks:
      - cluster-mesh-network

  dashboard-client-proxy:
    container_name: zoom_frontend_client_layer
    image: nginx:alpine
    depends_on:
      workspace-signaling-engine:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host ports are configurable so the proxy never has to fight for 8080 (PROXY_*_PORT in .env)
      - "${PROXY_MAIN_PORT:-8080}:80"
      - "${PROXY_MEET_PORT:-8081}:81"
      - "${PROXY_MAIN_TLS_PORT:-8443}:443"
      - "${PROXY_MEET_TLS_PORT:-8444}:444"
    volumes:
      - ./Qorlla-Logo.jpg:/usr/share/nginx/html/Qorlla-Logo.jpg:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ${PROXY_TLS_CONF:-./deploy/nginx/tls-disabled.conf}:/etc/nginx/conf.d/tls.conf:ro
      - ${PROXY_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./qorlla.html:/usr/share/nginx/html/qorlla.html:ro
      - ./chat.html:/usr/share/nginx/html/chat.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./i18n.js:/usr/share/nginx/html/i18n.js:ro
      - ./locales:/usr/share/nginx/html/locales:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - cluster-mesh-network

volumes:
  workspace-data:
  main-db-data:

networks:
  cluster-mesh-network:
    driver: bridge