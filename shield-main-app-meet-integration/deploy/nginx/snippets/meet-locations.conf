# Stand-alone Meet site (own host/port), kept for deployments that do not use the single-origin layout.
client_max_body_size 64k;
access_log /dev/stdout json_access;
location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
location ^~ /api/integrations/ { return 404; }
location = /api/ready { return 404; }
location /socket.io/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://meet_upstream;
    proxy_read_timeout 3600s; proxy_send_timeout 3600s;
}
location / { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://meet_upstream; proxy_read_timeout 30s; }
