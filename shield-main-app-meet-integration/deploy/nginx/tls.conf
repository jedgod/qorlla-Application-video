# TLS twins of the HTTP servers. Certificates are mounted at /etc/nginx/certs (never committed; see .gitignore).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_session_timeout 1h;

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/main-locations.conf;
}
server {
    listen 444 ssl;
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/meet-locations.conf;
}
