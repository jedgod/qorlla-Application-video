# Public reverse proxy (HTTP). Single origin on :80 (MAIN + /app/ + /api/v1/ + /pricing/ + /meet/); stand-alone Meet site on :81.
# For HTTPS set PROXY_TLS_CONF=./deploy/nginx/tls.conf and PROXY_HTTP_CONF=./deploy/nginx/http-redirect.conf (see docs/RUNBOOK.md).
server {
    listen 80;
    include /etc/nginx/snippets/main-locations.conf;
}
server {
    listen 81;
    include /etc/nginx/snippets/meet-locations.conf;
}
