services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qorlla_meet
      POSTGRES_USER: qorlla
      POSTGRES_PASSWORD: qorlla_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["qorlla_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qorlla -d qorlla_meet"]
      interval: 5s
      retries: 10
volumes:
  qorlla_pg:
