# Example nginx in front of two Qorlla Voice replicas (RC2 multi-host staging). A TEMPLATE, not yet run against real hosts.
# What matters, and why:
#   * WSS only; HTTP redirects to HTTPS. The WebSocket carries the one-use ticket in the Sec-WebSocket-Protocol header, never in the URL, but keep query strings out of logs anyway (log $uri, not $request).
#   * Forward Origin untouched: the engine checks it against VOICE_ALLOWED_ORIGIN and refuses a foreign origin.
#   * Long read timeout for the socket (the engine pings every 30 s). No stickiness needed: any replica can serve any client, because state lives in PostgreSQL.
#   * Open-source nginx has only PASSIVE health checks. For routing NEW calls by /v1/voice/operational/readiness use HAProxy, a cloud load balancer, or nginx Plus (active checks).
upstream qorlla_voice { server voice-a.internal:4600 max_fails=2 fail_timeout=10s; server voice-b.internal:4600 max_fails=2 fail_timeout=10s; keepalive 32; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format voice '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=voice_ws:10m rate=20r/s;
server { listen 80; server_name voice.example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name voice.example.com;
  ssl_certificate /etc/ssl/voice/fullchain.pem; ssl_certificate_key /etc/ssl/voice/privkey.pem; ssl_protocols TLSv1.2 TLSv1.3;
  access_log /var/log/nginx/voice.access.log voice;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location /v1/voice/ws {
    limit_req zone=voice_ws burst=40 nodelay;
    proxy_pass http://qorlla_voice; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host; proxy_set_header Origin $http_origin; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3700s; proxy_send_timeout 3700s; proxy_buffering off;
  }
  location /v1/voice/admin/ { allow 10.0.0.0/8; deny all; proxy_pass http://qorlla_voice; }                  # server-to-server only: never from the internet
  location /v1/voice/ { proxy_pass http://qorlla_voice; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header Origin $http_origin; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 15s; }
  location = /healthz { proxy_pass http://qorlla_voice; }
  location = /readyz { proxy_pass http://qorlla_voice; }
}
