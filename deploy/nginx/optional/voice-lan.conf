# Qorlla Voice for pages served over HTTPS: a secure page may not call plain http://localhost:4600 (mixed content, and "localhost" on a phone is the phone),
# so the engine is reached through this origin at /voice/ (REST and the signaling WebSocket). Mounted only by deploy/docker-compose.lan-tls.yml.
# The engine's admin API is never routed.
location ^~ /voice/v1/voice/admin { return 404; }
location ^~ /voice/ {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_pass http://host.docker.internal:4600/;
}
