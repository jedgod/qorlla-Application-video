# Qorlla Clips (Next.js built with CLIPS_BASE_PATH=/clips; it keeps its own prefix). OPT-IN: mount this file into the proxy at
# /etc/nginx/optional/clips.conf, and give the proxy extra_hosts host.docker.internal:host-gateway when Clips runs on the Docker host.
#   volumes: [ "./deploy/nginx/optional/clips.conf:/etc/nginx/optional/clips.conf:ro" ]
# Change the address below if Clips runs somewhere else (a service name on the compose network, for example).
# Next.js owns the trailing-slash rule, so /clips is proxied too; a redirect here would loop with it.
location = /clips { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://host.docker.internal:3410; proxy_read_timeout 60s; }
location ^~ /clips/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://host.docker.internal:3410; proxy_read_timeout 60s; }
