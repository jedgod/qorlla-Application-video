# TLS twins of the HTTP servers for a development stack on a local network (see deploy/docker-compose.lan-tls.yml and deploy/certs/make-lan-cert.sh).
# Differs from tls.conf only in sending NO Strict-Transport-Security header: HSTS is remembered per host name, and on "localhost" it would force every
# http://localhost:<port> page of every local stack to https and break them.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_session_timeout 1h;

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    include /etc/nginx/snippets/main-locations.conf;
}
server {
    listen 444 ssl;
    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    include /etc/nginx/snippets/meet-locations.conf;
}
