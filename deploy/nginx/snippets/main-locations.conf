# MAIN site (workplace, chat, built-in meetings page). Included by the HTTP and TLS main servers.
root /usr/share/nginx/html;
index qorlla.html;
client_max_body_size 10m;

# API and websockets go to the Node backend so cookies and sockets stay same-origin
location /api/ {
    proxy_pass http://workspace-signaling-engine:5000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

location /socket.io/ {
    proxy_pass http://workspace-signaling-engine:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
}

# Tells qorlla.html where the public Meet site is (MEET_PUBLIC_URL on the backend)
location = /meet-config.js {
    proxy_pass http://workspace-signaling-engine:5000;
    proxy_set_header Host $http_host;
}
location = /favicon.ico {
    proxy_pass http://workspace-signaling-engine:5000;
    proxy_set_header Host $http_host;
}

location / {
    try_files $uri $uri/ =404;
}
