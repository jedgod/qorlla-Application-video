# One public origin. Explicit routes (longest prefix wins):
#   /                       MAIN pages (qorlla.html, login.html, chat.html, index.html ...) and MAIN's /api/*
#   /api/v1/ , /app/        Workplace Portal (API and single-page UI)
#   /pricing/               Pricing page (separate static application)
#   /meet/                  Qorlla Meet (websocket-capable); its internal bridge is never routed
#   /.well-known/jwks.json  MAIN's public signing keys (the portal verifies identity with them)
root /usr/share/nginx/html;
index qorlla.html;
client_max_body_size 10m;
access_log /dev/stdout json_access;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

# ---- never reachable from outside ----
location ^~ /api/auth/internal/ { return 404; }           # MAIN session introspection (portal <-> MAIN only)
location ^~ /meet/api/integrations/ { return 404; }       # MAIN <-> Meet sync bridge and host recovery
location = /meet/api/ready { return 404; }

# ---- Workplace Portal ----
location ^~ /api/v1/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://portal_upstream; proxy_read_timeout 30s; }
location = /app { return 301 /app/; }
location ^~ /app/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://portal_upstream; proxy_read_timeout 30s; }

# ---- Pricing page (static, separate application) ----
location = /pricing { return 301 /pricing/; }
location ^~ /pricing/ {
    alias /usr/share/nginx/pricing/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}

# ---- Qorlla Meet under /meet/ (prefix is stripped) ----
location = /meet { return 301 /meet/; }
location ^~ /meet/socket.io/ {
    rewrite ^/meet/(.*)$ /$1 break;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://meet_upstream;
    proxy_read_timeout 3600s; proxy_send_timeout 3600s;
}
location ^~ /meet/ {
    rewrite ^/meet/(.*)$ /$1 break;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://meet_upstream;
    proxy_read_timeout 30s;
}

# ---- MAIN ----
location = /.well-known/jwks.json { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://main_upstream; }
location /api/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://main_upstream; proxy_read_timeout 30s; }
location /socket.io/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://main_upstream;
    proxy_read_timeout 3600s;
}
location = /meet-config.js { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://main_upstream; }
location = /favicon.ico { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://main_upstream; }
location / { try_files $uri $uri/ =404; }
