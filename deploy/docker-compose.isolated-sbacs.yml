# SBACS BROWSER-CERTIFICATION ENVIRONMENT. ISOLATED TEST PROJECTS ONLY: never qiso, qtls, qclk, or any production-default environment.
# Adds to an isolated project (own name, volumes, database, ports):
#   * the SBACS migrations 012-014 (a FRESH database applies them at initialisation, after 001-011 and before the role script)
#   * billing switched on against the deterministic Stripe TEST DOUBLE (qorlla-portal/tests/fake-stripe.mjs) running on the host. No real payment provider, no real key:
#     the key below is the double's fixed fake. 'billing_live' still ships OFF in the database; the browser suites turn it on per test and prove the OFF behaviour.
# Use it as the fourth -f file next to the AI test-adapter overlay (the AI browser specs need it):
#   ISO_PROJECT=qsbacs ISO_STATE_DIR=.dev-stack-sbacs ISO_PROXY_PORT=4100 node scripts/iso-compose-env.mjs
#   node qorlla-portal/tests/fake-stripe.mjs 19501            # the test double, on the host
#   docker compose -p qsbacs --env-file .dev-stack-sbacs/compose.env -f docker-compose.yml -f deploy/docker-compose.isolated.yml -f deploy/docker-compose.isolated-ai.yml -f deploy/docker-compose.isolated-sbacs.yml up -d --build
services:
  meet-db:
    volumes:
      - ./qorlla-meet-video/sql/v4_23_sbacs_outbox.sql:/docker-entrypoint-initdb.d/005r_sbacs_outbox.sql:ro
  # Meet enforces SBACS entitlements through the portal's internal API (workload identity: Ed25519, one key per service identity). Off unless SBACS_MODE is set in the project env file.
  meet:
    environment:
      - SBACS_MODE=${SBACS_MODE:-off}
      - SBACS_URL=${SBACS_URL:-}
      - SBACS_MEET_PRIVATE_KEY_B64=${SBACS_MEET_PRIVATE_KEY_B64:-}
      - SBACS_STORAGE_PRIVATE_KEY_B64=${SBACS_STORAGE_PRIVATE_KEY_B64:-}
      - SBACS_GRACE_MIB=${SBACS_GRACE_MIB:-4}
      - SBACS_DRAIN_MS=${SBACS_DRAIN_MS:-3000}
      # recording acceptance tests (R01-R18) need SHORT clocks (1 retention "day" = 4 s). Empty = Meet's normal defaults. Set these only for a test run, never in production.
      - RECORDING_DAY_MS=${RECORDING_DAY_MS:-}
      - RECORDING_SWEEP_MS=${RECORDING_SWEEP_MS:-}
      - RECORDING_IDLE_MS=${RECORDING_IDLE_MS:-}
      - RECORDING_FINALIZE_GRACE_MS=${RECORDING_FINALIZE_GRACE_MS:-}
      - RECORDING_LATE_CHUNK_MS=${RECORDING_LATE_CHUNK_MS:-}
      - RECORDING_LINK_SECONDS=${RECORDING_LINK_SECONDS:-}
  main-db:
    volumes:
      - ./qorlla-portal/sql/012_sbacs.sql:/docker-entrypoint-initdb.d/012i_portal_012_sbacs.sql:ro
      - ./qorlla-portal/sql/013_sbacs_enforcement.sql:/docker-entrypoint-initdb.d/012j_portal_013_sbacs_enforcement.sql:ro
      - ./qorlla-portal/sql/014_sbacs_billing.sql:/docker-entrypoint-initdb.d/012k_portal_014_sbacs_billing.sql:ro
  qorlla-portal:
    labels:
      qorlla.sbacs-test-billing: "test environment only: billing points at a local test double"
    environment:
      - SBACS_SERVICE_PUBLIC_KEYS=${SBACS_SERVICE_PUBLIC_KEYS:-}
      - PLATFORM_ADMIN_USER_IDS=${SBACS_E2E_ADMIN_ID:-}
      - BILLING_ENABLED=true
      - STRIPE_SECRET_KEY=sk_test_fake
      - STRIPE_WEBHOOK_SECRET=whsec_testtesttesttesttesttesttesttest
      - STRIPE_API_BASE=http://host.docker.internal:${FAKE_STRIPE_PORT:-19501}
    extra_hosts:
      - "host.docker.internal:host-gateway"
