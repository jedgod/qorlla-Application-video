# Zoom Workspace Core Platform Continuous Integration Pipeline
# Target Scope: Automated Dependency Provisioning, Container Orchestration, & Playwright Testing Matrix

name: Zoom Workspace CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build Cluster & Execute Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout application codebase repositories
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      # 2) Initialize uniform Node runtime environments
      - name: Setup Node.js Build Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3) Provision core package dependencies
      - name: Install Application and Testing Dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # 4) Audit configuration setups and syntax compilation checks
      - name: Run Basic Lint & Syntax Validation Checks
        run: |
          for f in server.js appointments.js docs.js post-meeting.js notifications.js workplace.js auth.js store.js mailer.js; do node --check "$f" || exit 1; done

      # 4b) Self-test the report scanner and the artifact upload policy. It needs only Node, so it runs BEFORE the container cluster: a broken scanner or a weakened upload policy fails the pipeline even when the cluster cannot start,
      # and the upload steps below can never rely on an untested scanner.
      - name: Self-test the Playwright report scanner and the artifact upload policy
        run: |
          node --test ci/tests/*.test.cjs

      # 5a) Repair of the pre-existing CI failure (docker-compose.yml requires database passwords and secrets that CI never provided): generate EPHEMERAL, distinct, random values for the disposable cluster only.
      # They are written to $RUNNER_TEMP (never the repository), masked in logs, never printed, never exported as values, and deleted at teardown. Authentication stays required: nothing is defaulted or left empty.
      - name: Generate the disposable cluster's ephemeral secrets
        run: |
          bash ci/cluster.sh prepare

      - name: Validate the compose configuration (the resolved configuration is not printed)
        run: |
          bash ci/cluster.sh check

      # 5b) Build and orchestrate isolated container runtime engines
      - name: Initialize Docker Compose Multi-Container Cluster
        run: |
          bash ci/cluster.sh up
          echo "Awaiting virtual service cluster boot sequences..."
          sleep 5

      # 6) Validate operational environment readiness via HTTP endpoints
      - name: Verify Backend Signaling Gateway Telemetry
        run: |
          curl --silent --fail http://localhost:5000/api/meetings/validate/858%209833%203712 || exit 1
          curl --silent --fail http://localhost:8080 || exit 1

      # 7) Execute the complete Playwright E2E Integration Suite
      - name: Execute Playwright Automated Integration Test Matrix
        id: playwright
        run: |
          npx playwright test
        env:
          CI: true
          NODE_ENV: test

      # 8) Diagnostics on failure. This is a PUBLIC log: raw `docker compose logs` can carry database credentials, connection strings and authentication headers, so it is never printed.
      # The summary shows service states and only error, warning and lifecycle lines, with secrets, addresses and tokens redacted (ci/sanitize-diagnostics.cjs).
      - name: Sanitized diagnostics on failure (service states and redacted error lines only)
        if: failure()
        run: |
          bash ci/cluster.sh diagnostics

      # 9a) Fail-closed scan of the Playwright report BEFORE anything can be uploaded. This repository is PUBLIC: an artifact can be downloaded by anyone signed in to GitHub.
      # The scan opens the trace archives (and archives inside them), the base64 archive embedded in index.html, network captures and screenshot metadata, and refuses anything sensitive or not understood.
      - name: Scan the Playwright report for sensitive content (fail-closed)
        id: scan
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' && hashFiles('playwright-report/**') != '' }}
        run: |
          node ci/scan-playwright-report.cjs playwright-report --allowlist ci/artifact-scan-allowlist.json
        env:
          # Attestation that this run handled only synthetic data: a throwaway docker-compose cluster, Chromium's fake camera and microphone, generated example.com accounts, no production data and no secrets.
          # Screenshots are refused without it.
          QORLLA_CI_SYNTHETIC_DATA: '1'

      # 9b) Upload the report ONLY when the Playwright tests failed (the report is then needed to diagnose) AND the scan above passed. Seven days, not thirty. Nothing is uploaded when the tests pass.
      - name: Archive the Playwright report (tests failed and the scan passed)
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

      # 10) Teardown transient resource limits cleanly
      - name: Teardown Active Cluster Containers
        if: always()
        run: |
          bash ci/cluster.sh down
