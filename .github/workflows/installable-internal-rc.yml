name: Qorlla internal installable build verification
# BUILD VERIFICATION ONLY. This repository is PUBLIC, so this workflow uploads NO installers, APKs or other build artifacts (anyone signed in to GitHub could download them).
# Each job builds an UNSIGNED package, prints its SHA-256 into the run summary and discards it. Production release stays BLOCKED; a green run is evidence that the project builds, not a release candidate.
# Triggers: a push to the integration branch that touches the clients, or a manual run (a manual run only registers once this file exists on the default branch; supply the full commit SHA).
on:
  push:
    branches: [integration/installable-clients]
    paths: ['qorlla-clients/**', '.github/workflows/installable-internal-rc.yml']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: installable-internal-rc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ('${{ github.sha }}' -ne '${{ inputs.expected_sha }}') { throw 'SHA mismatch: select the exact commit in Run workflow' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned Windows installer
        shell: pwsh
        working-directory: qorlla-clients/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run dist -- --win nsis --x64
      - name: Hash installer (not uploaded)
        shell: pwsh
        run: |
          $files = Get-ChildItem qorlla-clients/apps/desktop/dist -File | Where-Object { $_.Extension -eq '.exe' }
          if (!$files) { throw 'No NSIS executable produced' }
          foreach ($f in $files) { $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); $s = (Get-AuthenticodeSignature $f.FullName).Status; "$h  $($f.Name)  authenticode=$s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned Linux AppImage and deb
        working-directory: qorlla-clients/apps/desktop
        run: |
          npm ci
          npm test
          npm run dist -- --linux AppImage deb --x64
      - name: Hash packages (not uploaded)
        run: |
          ls -la qorlla-clients/apps/desktop/dist
          find qorlla-clients/apps/desktop/dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -print | tee linux-packages.txt
          test -s linux-packages.txt
          while read -r f; do sha256sum "$f"; done < linux-packages.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Packaging checks on the deb and the AppImage (packaging only; installing on a real distribution is a separate acceptance step)
        working-directory: qorlla-clients/apps/desktop/dist
        run: |
          fail() { echo "::error::$1"; exit 1; }
          DEB=$(ls *.deb 2>/dev/null | head -1); APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          test -n "$DEB" || fail "no .deb was produced"; test -n "$APPIMAGE" || fail "no .AppImage was produced"
          echo "deb: $DEB   AppImage: $APPIMAGE"
          echo '--- deb metadata'; dpkg-deb -I "$DEB" | grep -E "^ (Package|Version|Architecture|Maintainer|Homepage|Description):" | tee deb-info.txt
          grep -q "^ Package: qorlla$" deb-info.txt || fail "deb Package is not qorlla"
          dpkg-deb -c "$DEB" > deb-files.txt
          echo '--- executable (must be executable and named qorlla)'; grep -E " \./opt/[^/]+/qorlla$" deb-files.txt | tee exe.txt; grep -qE "^-rwx" exe.txt || fail "the qorlla executable is missing or not executable"
          echo '--- chrome-sandbox'; grep -E "chrome-sandbox$" deb-files.txt | tee sandbox.txt; grep -qE "^-rwsr-xr-x" sandbox.txt || fail "chrome-sandbox is missing or not setuid root-owned 4755"
          echo '--- desktop entry'; grep -E " \./usr/share/applications/.*\.desktop$" deb-files.txt | tee desktop-path.txt; test -s desktop-path.txt || fail "no desktop entry in the deb"
          DESKTOP=$(awk '{print $NF}' desktop-path.txt | head -1); dpkg-deb --fsys-tarfile "$DEB" | tar -xO "$DESKTOP" > desktop-entry.txt; cat desktop-entry.txt
          grep -q "^Name=Qorlla$" desktop-entry.txt || fail "the displayed application name is not Qorlla"; grep -qE "^Exec=.*qorlla" desktop-entry.txt || fail "desktop Exec does not start the qorlla executable"; grep -q "^Icon=" desktop-entry.txt || fail "desktop entry has no Icon"
          echo '--- installed icon'; grep -E " \./usr/share/icons/.*\.png$" deb-files.txt | tee icons.txt; test -s icons.txt || fail "no installed icon in the deb"
          echo '--- AppImage'; test -x "$APPIMAGE" || fail "the AppImage is not executable"; "./$APPIMAGE" --appimage-extract > /dev/null; grep -E "^(Name|Exec|Icon)=" squashfs-root/*.desktop | tee appimage-desktop.txt; grep -q "^Name=Qorlla$" appimage-desktop.txt || fail "AppImage desktop name is not Qorlla"
          echo "Linux packaging checks passed for $DEB and $APPIMAGE (not installed or run)" | tee -a "$GITHUB_STEP_SUMMARY"
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned, un-notarized macOS dmg
        working-directory: qorlla-clients/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run dist -- --mac dmg
      - name: Hash dmg (not uploaded)
        run: |
          find qorlla-clients/apps/desktop/dist -maxdepth 1 -type f -name '*.dmg' -print | tee mac-packages.txt
          test -s mac-packages.txt
          while read -r f; do shasum -a 256 "$f"; codesign -dv "$f" 2>&1 | head -3 || true; done < mac-packages.txt | tee -a "$GITHUB_STEP_SUMMARY"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licences (the runner image already ships the SDK; the setup-android action failed in sdkmanager)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Record the preinstalled Android SDK and fail clearly if what the build needs is absent
        env:
          REQUIRED_PLATFORM: android-36
          MIN_BUILD_TOOLS_MAJOR: '35'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          {
            echo '### Android SDK on this runner'
            echo "platforms: $(ls "$ANDROID_HOME/platforms" | paste -sd' ' -)"
            echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | paste -sd' ' -)"
            echo "ndk: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | paste -sd' ' -)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -d "$ANDROID_HOME/platforms/$REQUIRED_PLATFORM" || { echo "::error::Required SDK platform $REQUIRED_PLATFORM is not preinstalled on this runner image"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | awk -F. -v m="$MIN_BUILD_TOOLS_MAJOR" '$1>=m' | tail -1)
          test -n "$BT" || { echo "::error::No Android build-tools >= $MIN_BUILD_TOOLS_MAJOR on this runner image"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/$BT/apksigner" || { echo "::error::apksigner missing from build-tools/$BT"; exit 1; }
          echo "Using build-tools $BT"
      - name: Unit tests and native Android generation
        working-directory: qorlla-clients/apps/mobile
        run: |
          npm ci
          npm test
          npx expo prebuild --platform android --non-interactive --clean
      - name: "Build release APK (no test flags, no origins configured: the app fails closed)"
        working-directory: qorlla-clients/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify and hash APK (not uploaded)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1); echo "apksigner: $APKSIGNER"
          find qorlla-clients/apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f -print | tee android-apks.txt
          test -s android-apks.txt
          while read -r apk; do sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"; "$APKSIGNER" verify --print-certs --verbose "$apk" 2>&1 | grep -E "Verifies|certificate (DN|SHA-256)|Signer" | tee -a "$GITHUB_STEP_SUMMARY"; done < android-apks.txt
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/mobile/package-lock.json }
      - name: Unit tests and native iOS generation
        working-directory: qorlla-clients/apps/mobile
        run: |
          npm ci
          npm test
          npx expo prebuild --platform ios --non-interactive --clean
      - name: "Build for the iOS simulator (no Apple signing: this proves it compiles, NOT that it installs on an iPhone)"
        working-directory: qorlla-clients/apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          echo "iOS simulator build succeeded for scheme $SCHEME (unsigned, simulator only)" | tee -a "$GITHUB_STEP_SUMMARY"
