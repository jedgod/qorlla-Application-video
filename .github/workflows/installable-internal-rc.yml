name: Qorlla internal installable build verification
# BUILD VERIFICATION ONLY. This repository is PUBLIC, so this workflow uploads NO installers, APKs or other build artifacts (anyone signed in to GitHub could download them).
# Each job builds an UNSIGNED package, prints its SHA-256 into the run summary and discards it. Production release stays BLOCKED; a green run is evidence that the project builds, not a release candidate.
# Triggers: a push to the integration branch that touches the clients, or a manual run (a manual run only registers once this file exists on the default branch; supply the full commit SHA).
on:
  push:
    branches: [integration/installable-clients]
    paths: ['qorlla-clients/**', '.github/workflows/installable-internal-rc.yml']
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to certify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: installable-internal-rc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ('${{ github.sha }}' -ne '${{ inputs.expected_sha }}') { throw 'SHA mismatch: select the exact commit in Run workflow' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned Windows installer
        shell: pwsh
        working-directory: qorlla-clients/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run dist -- --win nsis --x64
      - name: Hash installer (not uploaded)
        shell: pwsh
        run: |
          $files = Get-ChildItem qorlla-clients/apps/desktop/dist -File | Where-Object { $_.Extension -eq '.exe' }
          if (!$files) { throw 'No NSIS executable produced' }
          foreach ($f in $files) { $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(); $s = (Get-AuthenticodeSignature $f.FullName).Status; "$h  $($f.Name)  authenticode=$s" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY }
  linux:
    # Pinned, not "latest": the install/launch gate below depends on Ubuntu 24.04's AppArmor 4 and its user-namespace restriction. A runner-image change must be a reviewed change, not a surprise.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned Linux AppImage and deb
        working-directory: qorlla-clients/apps/desktop
        run: |
          npm ci
          npm test
          npm run dist -- --linux AppImage deb --x64
      - name: Hash packages (not uploaded)
        run: |
          ls -la qorlla-clients/apps/desktop/dist
          find qorlla-clients/apps/desktop/dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -print | tee linux-packages.txt
          test -s linux-packages.txt
          while read -r f; do sha256sum "$f"; done < linux-packages.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Packaging checks on the deb and the AppImage (packaging only; installing on a real distribution is a separate acceptance step)
        working-directory: qorlla-clients/apps/desktop/dist
        run: |
          fail() { echo "::error::$1"; exit 1; }
          DEB=$(ls *.deb 2>/dev/null | head -1); APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          test -n "$DEB" || fail "no .deb was produced"; test -n "$APPIMAGE" || fail "no .AppImage was produced"
          echo "deb: $DEB   AppImage: $APPIMAGE"
          echo '--- deb metadata'; dpkg-deb -I "$DEB" | grep -E "^ (Package|Version|Architecture|Maintainer|Homepage|Description):" | tee deb-info.txt
          grep -q "^ Package: qorlla$" deb-info.txt || fail "deb Package is not qorlla"
          dpkg-deb -c "$DEB" > deb-files.txt
          echo '--- executable (must be executable and named qorlla)'; grep -E " \./opt/[^/]+/qorlla$" deb-files.txt | tee exe.txt; grep -qE "^-rwx" exe.txt || fail "the qorlla executable is missing or not executable"
          echo '--- chrome-sandbox: shipped root-owned and NOT setuid; the setuid helper is not the solution (the AppArmor profile is)'; grep -E "chrome-sandbox$" deb-files.txt | tee sandbox.txt; test -s sandbox.txt || fail "chrome-sandbox is missing from the deb"; grep -qE "^-rwxr-xr-x 0/0 .* \./opt/Qorlla/chrome-sandbox$" sandbox.txt || fail "chrome-sandbox must be mode 0755 owned by root (not setuid)"
          dpkg-deb -e "$DEB" control-scripts; ! grep -qE "4755|chmod u\+s" control-scripts/postinst control-scripts/postrm || fail "a maintainer script makes something setuid"
          echo '--- AppArmor profile is shipped and the maintainer scripts handle it'; grep -E " \./opt/Qorlla/resources/apparmor/qorlla$" deb-files.txt | tee profile-path.txt; test -s profile-path.txt || fail "the AppArmor profile is not in the deb"; grep -qE "^-rw-r--r-- 0/0 " profile-path.txt || fail "the shipped AppArmor profile must be root-owned and mode 0644 (not writable by group or others): $(cat profile-path.txt)"
          grep -q "apparmor_parser --replace" control-scripts/postinst || fail "postinst does not load the AppArmor profile"; grep -qE "apparmor_parser --remove" control-scripts/postrm || fail "postrm does not unload the AppArmor profile"; grep -qE "remove\|purge\)" control-scripts/postrm || fail "postrm must unload the profile on remove and purge only (not on upgrade)"
          echo '--- desktop entry'; grep -E " \./usr/share/applications/.*\.desktop$" deb-files.txt | tee desktop-path.txt; test -s desktop-path.txt || fail "no desktop entry in the deb"
          DESKTOP=$(awk '{print $NF}' desktop-path.txt | head -1); dpkg-deb --fsys-tarfile "$DEB" | tar -xO "$DESKTOP" > desktop-entry.txt; cat desktop-entry.txt
          grep -q "^Name=Qorlla$" desktop-entry.txt || fail "the displayed application name is not Qorlla"; grep -qE "^Exec=.*qorlla" desktop-entry.txt || fail "desktop Exec does not start the qorlla executable"; grep -q "^Icon=" desktop-entry.txt || fail "desktop entry has no Icon"
          echo '--- installed icon'; grep -E " \./usr/share/icons/.*\.png$" deb-files.txt | tee icons.txt; test -s icons.txt || fail "no installed icon in the deb"
          echo '--- AppImage'; test -x "$APPIMAGE" || fail "the AppImage is not executable"; "./$APPIMAGE" --appimage-extract > /dev/null; grep -E "^(Name|Exec|Icon)=" squashfs-root/*.desktop | tee appimage-desktop.txt; grep -q "^Name=Qorlla$" appimage-desktop.txt || fail "AppImage desktop name is not Qorlla"
          echo "Linux packaging checks passed for $DEB and $APPIMAGE (not installed or run)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Sandbox regression check (MANDATORY): fail if any packaged launcher disables the Chromium sandbox"
        run: |
          set -e
          node --test qorlla-clients/e2e/linux-sandbox-check.test.cjs qorlla-clients/e2e/linux-launch-smoke.test.cjs
          cd qorlla-clients/apps/desktop/dist
          rm -rf sbx && mkdir -p sbx/deb
          dpkg-deb -x qorlla-*-amd64.deb sbx/deb
          chmod +x qorlla-*.AppImage
          (cd sbx && ../qorlla-*.AppImage --appimage-extract > /dev/null)
          cd - > /dev/null
          node qorlla-clients/e2e/linux-sandbox-check.cjs qorlla-clients/apps/desktop/dist/sbx/deb qorlla-clients/apps/desktop/dist/sbx/squashfs-root | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "AppArmor profile syntax (MANDATORY): the shipped profile must compile"
        run: |
          set -euo pipefail
          sudo apt-get update -qq; sudo apt-get install -y -qq apparmor-utils > /dev/null
          rm -rf aa && mkdir aa && dpkg-deb --fsys-tarfile qorlla-clients/apps/desktop/dist/qorlla-*-amd64.deb | tar -xO ./opt/Qorlla/resources/apparmor/qorlla > aa/qorlla
          cat aa/qorlla | grep -v '^#' | grep -v '^$'
          sudo apparmor_parser --version | head -1
          sudo apparmor_parser --skip-kernel-load --skip-cache --skip-read-cache aa/qorlla
          echo "AppArmor profile compiles without errors" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Debian install, AppArmor enforcement and real launch (MANDATORY): install, profile loaded and attached, window, sandbox, media, fail-closed control, upgrade, remove, purge"
        run: |
          set -euo pipefail
          DEB=$(ls "$PWD"/qorlla-clients/apps/desktop/dist/qorlla-*-amd64.deb); SMOKE="node qorlla-clients/e2e/linux-launch-smoke.cjs /opt/Qorlla/qorlla"
          sudo apt-get install -y -qq xvfb > /dev/null
          RESTRICT=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)
          { echo '### Debian install and launch (mandatory gate)'; echo "$(. /etc/os-release; echo "$PRETTY_NAME"), kernel $(uname -r), kernel.apparmor_restrict_unprivileged_userns=$RESTRICT, running as $(id -un) (uid $(id -u))"; } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(id -u)" != 0 || { echo "::error::must run as a normal user"; exit 1; }
          test "$RESTRICT" = 1 || { echo "::error::this runner does not restrict unprivileged user namespaces, so this test would not prove the profile is what makes the sandbox work"; exit 1; }
          loaded() { sudo cat /sys/kernel/security/apparmor/profiles | grep -E '^qorlla \('; }
          echo "== 1. install"; sudo apt-get install -y -qq "$DEB"
          sudo test -f /etc/apparmor.d/qorlla; echo "profile file installed, root-owned: $(sudo stat -c '%U:%G %a' /etc/apparmor.d/qorlla)"
          echo "== 2. the profile is LOADED in the kernel (a file on disk proves nothing)"; loaded | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== 3. launch as a normal user: window, sandbox, profile attached to the running process, media"; xvfb-run -a $SMOKE --expect-profile qorlla | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== 4. NEGATIVE CONTROL: with the profile unloaded (runtime only; the host setting is untouched) the app must refuse to start, not run unsandboxed"
          sudo apparmor_parser --remove /etc/apparmor.d/qorlla; ! loaded
          xvfb-run -a $SMOKE --expect-sandbox-refusal | tee -a "$GITHUB_STEP_SUMMARY"
          sudo apparmor_parser --replace /etc/apparmor.d/qorlla; loaded > /dev/null
          echo "== 5. upgrade (same version reinstalled over itself): profile still loaded and the app still launches"; sudo dpkg -i "$DEB" > /dev/null; loaded > /dev/null; sudo test -f /etc/apparmor.d/qorlla
          xvfb-run -a $SMOKE --expect-profile qorlla | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== 6. remove: profile unloaded and deleted"; sudo apt-get remove -y -qq qorlla > /dev/null; ! loaded; ! sudo test -e /etc/apparmor.d/qorlla; test ! -e /opt/Qorlla/qorlla
          echo "== 7. reinstall, then purge: nothing left behind"; sudo apt-get install -y -qq "$DEB" > /dev/null; loaded > /dev/null; sudo apt-get purge -y -qq qorlla > /dev/null; ! loaded; ! sudo test -e /etc/apparmor.d/qorlla
          echo "Debian install, AppArmor enforcement, launch, upgrade, remove and purge all behaved as required" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "AppImage diagnostics (informational; the AppImage stays NOT distributable): reproduce the exit code with FULL output"
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd qorlla-clients/apps/desktop/dist; A=$(ls "$PWD"/qorlla-*.AppImage); echo "AppImage: $A"; file "$A" | cut -c1-200; ls -la "$A"
          echo "--- required libraries missing for the AppImage runtime (type 2 needs libfuse2 unless extracted):"; ldconfig -p | grep -c "libfuse.so.2" | sed 's/^/libfuse.so.2 entries: /'
          rm -rf ax && mkdir ax && (cd ax && "$A" --appimage-extract > /dev/null 2>&1; echo "extract exit: $?")
          echo "--- extracted layout:"; ls -la ax/squashfs-root | head -12; file ax/squashfs-root/AppRun | cut -c1-200; head -c 600 ax/squashfs-root/AppRun | strings | head -12
          echo "--- missing shared libraries of the main binary (ldd, not found only):"; ldd ax/squashfs-root/qorlla 2>&1 | grep -i "not found" | head; echo "(none listed above = none missing)"
          for mode in "extract-and-run" "extracted AppRun" "extracted binary direct"; do
            echo; echo "=== run: $mode"
            case "$mode" in
              "extract-and-run") CMD=("$A" --appimage-extract-and-run) ;;
              "extracted AppRun") CMD=(bash -x ax/squashfs-root/AppRun) ;;
              *) CMD=(ax/squashfs-root/qorlla) ;;
            esac
            export QORLLA_APP_URL=https://qorlla-ci.invalid; timeout 25 xvfb-run -a "${CMD[@]}" > "appimage-$$.log" 2>&1; rc=$?; echo "exit code: $rc (124 = still running after 25 s)"
            grep -v -E "^/tmp/appimage_extracted|^\+\+ " "appimage-$$.log" | head -25 | cut -c1-260; echo "..."; grep -E "^\+ |FATAL|sandbox|No such file|not found|Permission denied" "appimage-$$.log" | tail -12 | cut -c1-260
          done 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
  linux-ubuntu-22-04:
    # Ubuntu 22.04 is NOT assumed to behave like 24.04: its AppArmor is version 3 and it does not restrict unprivileged user namespaces. This job records what it actually does and runs the same launch checks without requiring a profile.
    # CI evidence on a GitHub-hosted runner only; it builds its own deb (the repository is public, so no package is passed between jobs). Physical-machine certification is separate (qorlla-clients/docs/LINUX_CERTIFICATION.md).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package the unsigned Debian package
        working-directory: qorlla-clients/apps/desktop
        run: |
          npm ci
          npm test
          npm run dist -- --linux deb --x64
      - name: "Sandbox regression check (MANDATORY) and package hash"
        run: |
          set -euo pipefail
          DEB=$(ls qorlla-clients/apps/desktop/dist/qorlla-*-amd64.deb); sha256sum "$DEB" | tee -a "$GITHUB_STEP_SUMMARY"
          node --test qorlla-clients/e2e/linux-sandbox-check.test.cjs qorlla-clients/e2e/linux-launch-smoke.test.cjs qorlla-clients/e2e/linux-evidence-check.test.cjs qorlla-clients/e2e/release-safety.test.cjs
          echo "--- release safety (no workflow publishes an installer; the AppImage stays marked NOT-DISTRIBUTABLE)"; node qorlla-clients/e2e/release-safety.cjs | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf sbx && mkdir sbx && dpkg-deb -x "$DEB" sbx
          node qorlla-clients/e2e/linux-sandbox-check.cjs sbx | tee -a "$GITHUB_STEP_SUMMARY"
          dpkg-deb -e "$DEB" ctl; ! grep -qE "4755|chmod u\+s" ctl/postinst ctl/postrm
      - name: "Debian install and real launch on Ubuntu 22.04 (MANDATORY): what the host really does, launch, upgrade, remove, purge"
        run: |
          set -euo pipefail
          DEB=$(ls "$PWD"/qorlla-clients/apps/desktop/dist/qorlla-*-amd64.deb); SMOKE="node qorlla-clients/e2e/linux-launch-smoke.cjs /opt/Qorlla/qorlla"
          sudo apt-get update -qq; sudo apt-get install -y -qq xvfb > /dev/null
          RESTRICT=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent); PARSER=$(apparmor_parser --version 2>/dev/null | head -1 || echo none); ABI4=no; test -e /etc/apparmor.d/abi/4.0 && ABI4=yes
          UNSHARE=no; unshare -U true 2>/dev/null && UNSHARE=yes
          { echo '### Ubuntu 22.04 install and launch (mandatory gate)'; echo "$(. /etc/os-release; echo "$PRETTY_NAME"), kernel $(uname -r), running as $(id -un) (uid $(id -u))"; echo "kernel.apparmor_restrict_unprivileged_userns=$RESTRICT; AppArmor parser: $PARSER; abi/4.0 present: $ABI4; a normal user can create a user namespace: $UNSHARE"; } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(id -u)" != 0 || { echo "::error::must run as a normal user"; exit 1; }
          test "$RESTRICT" != 1 || { echo "::error::this runner restricts user namespaces like 24.04; use the 24.04 gate"; exit 1; }
          test "$UNSHARE" = yes || { echo "::error::a normal user cannot create a user namespace on this runner, so the sandbox cannot work here without extra configuration"; exit 1; }
          echo "== 1. install"; sudo apt-get install -y -qq "$DEB"
          echo "chrome-sandbox: $(stat -c 'mode=%a owner=%U' /opt/Qorlla/chrome-sandbox) (must not be setuid)"; test "$(stat -c %a /opt/Qorlla/chrome-sandbox)" = 755
          echo "AppArmor profile installed by the package: $(sudo test -e /etc/apparmor.d/qorlla && echo yes || echo no) (expected: no without AppArmor 4)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ABI4" = no ]; then ! sudo test -e /etc/apparmor.d/qorlla; fi
          echo "== 2. launch as a normal user: window, sandbox in effect, media (no profile required on this host)"; xvfb-run -a $SMOKE | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== 3. upgrade (same version reinstalled over itself): still launches"; sudo dpkg -i "$DEB" > /dev/null; xvfb-run -a $SMOKE | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== 4. remove, then reinstall and purge: nothing left behind"; sudo apt-get remove -y -qq qorlla > /dev/null; test ! -e /opt/Qorlla/qorlla; ! sudo test -e /etc/apparmor.d/qorlla
          sudo apt-get install -y -qq "$DEB" > /dev/null; sudo apt-get purge -y -qq qorlla > /dev/null; test ! -e /opt/Qorlla/qorlla; ! sudo test -e /etc/apparmor.d/qorlla
          echo "Ubuntu 22.04 install, launch (sandbox in effect), upgrade, remove and purge behaved as required" | tee -a "$GITHUB_STEP_SUMMARY"
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/desktop/package-lock.json }
      - name: Test and package unsigned, un-notarized macOS dmg
        working-directory: qorlla-clients/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm test
          npm run dist -- --mac dmg
      - name: Hash dmg (not uploaded)
        run: |
          find qorlla-clients/apps/desktop/dist -maxdepth 1 -type f -name '*.dmg' -print | tee mac-packages.txt
          test -s mac-packages.txt
          while read -r f; do shasum -a 256 "$f"; codesign -dv "$f" 2>&1 | head -3 || true; done < mac-packages.txt | tee -a "$GITHUB_STEP_SUMMARY"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licences (the runner image already ships the SDK; the setup-android action failed in sdkmanager)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Record the preinstalled Android SDK and fail clearly if what the build needs is absent
        env:
          REQUIRED_PLATFORM: android-36
          MIN_BUILD_TOOLS_MAJOR: '35'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          {
            echo '### Android SDK on this runner'
            echo "platforms: $(ls "$ANDROID_HOME/platforms" | paste -sd' ' -)"
            echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | paste -sd' ' -)"
            echo "ndk: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | paste -sd' ' -)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -d "$ANDROID_HOME/platforms/$REQUIRED_PLATFORM" || { echo "::error::Required SDK platform $REQUIRED_PLATFORM is not preinstalled on this runner image"; exit 1; }
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | awk -F. -v m="$MIN_BUILD_TOOLS_MAJOR" '$1>=m' | tail -1)
          test -n "$BT" || { echo "::error::No Android build-tools >= $MIN_BUILD_TOOLS_MAJOR on this runner image"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/$BT/apksigner" || { echo "::error::apksigner missing from build-tools/$BT"; exit 1; }
          echo "Using build-tools $BT"
      - name: Unit tests and native Android generation
        working-directory: qorlla-clients/apps/mobile
        run: |
          npm ci
          npm test
          npx expo prebuild --platform android --non-interactive --clean
      - name: "Build release APK (no test flags, no origins configured: the app fails closed)"
        working-directory: qorlla-clients/apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify and hash APK (not uploaded)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1); echo "apksigner: $APKSIGNER"
          find qorlla-clients/apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f -print | tee android-apks.txt
          test -s android-apks.txt
          while read -r apk; do sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"; "$APKSIGNER" verify --print-certs --verbose "$apk" 2>&1 | grep -E "Verifies|certificate (DN|SHA-256)|Signer" | tee -a "$GITHUB_STEP_SUMMARY"; done < android-apks.txt
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable commit
        if: github.event_name == 'workflow_dispatch'
        run: test "${{ github.sha }}" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: qorlla-clients/apps/mobile/package-lock.json }
      - name: Unit tests and native iOS generation
        working-directory: qorlla-clients/apps/mobile
        run: |
          npm ci
          npm test
          npx expo prebuild --platform ios --non-interactive --clean
      - name: "Build for the iOS simulator (no Apple signing: this proves it compiles, NOT that it installs on an iPhone)"
        working-directory: qorlla-clients/apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1); SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
          echo "iOS simulator build succeeded for scheme $SCHEME (unsigned, simulator only)" | tee -a "$GITHUB_STEP_SUMMARY"
