# Least-privilege Redis user for Qorlla Voice (tested against redis:7; see test/distributed.redis.test.mjs).
# The engine only publishes and subscribes on ONE channel, so that is all the user may do: no keys, no configuration, no other channels.
# Replace the password, keep it out of source control, and serve Redis over TLS (rediss://) on a private network.
user default off
user voice on >CHANGE_ME resetchannels &qorlla:voice:v1:signals -@all +publish +subscribe +ping +hello +auth +client|setinfo +client|setname +quit
# A scraper or operator account would be a separate user with read-only commands; the voice user must not be reused for it.
