<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qorlla Docs</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17213c;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{height:72px;background:white;border-bottom:1px solid #e3e7f2;display:flex;align-items:center;justify-content:space-between;padding:0 24px}aside{width:115px;position:fixed;top:0;bottom:0;background:#fff;border-right:1px solid #e3e7f2;padding:18px 10px}aside a{display:block;text-decoration:none;color:#536184;padding:13px 10px;border-radius:12px;text-align:center}aside a.active{background:#edf0ff;color:#355af3}main{margin-left:115px}.page{padding:32px;max-width:1320px;margin:auto}h1{margin:0;font-size:29px}p{color:#697794}.toolbar,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #dce2f0;border-radius:10px;padding:11px;background:white;color:#1b2b50}button{cursor:pointer}button.primary{background:#3157ed;color:white;border-color:#3157ed}button:disabled{opacity:.5;cursor:not-allowed}.card{background:#fff;border:1px solid #e0e6f1;border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:20px}.doc{cursor:pointer}.doc:hover{border-color:#3157ed}.doc small{color:#73809b}.layout{display:grid;grid-template-columns:190px 1fr;gap:24px;margin-top:24px}.nav button{display:block;width:100%;text-align:left;margin-bottom:8px}.editor{min-height:500px;width:min(100%,850px);margin:20px auto;padding:52px;background:white;border:1px solid #dfe5f0;box-shadow:0 8px 24px #23325b12;outline:none;line-height:1.65}.editor:focus{border-color:#3157ed}#status{font-size:13px;color:#536184}#error{color:#b42318}#editorView{display:none}@media(max-width:750px){aside{width:65px}aside a{font-size:11px;padding:9px 2px}main{margin-left:65px}.layout{grid-template-columns:1fr}.page{padding:16px}.editor{padding:20px}}
</style></head><body><aside><strong>🔷 Qorlla</strong><a href="/">Home</a><a href="/docs" class="active">Docs</a><a href="/mail">Mail</a><a href="/calendar">Calendar</a></aside><main><header><strong>Your workspace / Docs</strong><span>Qorlla Workspace</span></header><div class="page"><section id="homeView"><div class="toolbar" style="justify-content:space-between"><div><h1>Qorlla Docs</h1><p>Create, collaborate and manage your documents</p></div><button class="primary" id="newDoc">+ New document</button></div><div class="actions"><input id="search" placeholder="Search documents" aria-label="Search documents"><select id="view" aria-label="Document view"><option value="recent">Recent</option><option value="mine">My Documents</option><option value="shared">Shared With Me</option><option value="starred">Starred</option><option value="templates">Templates</option><option value="trash">Trash</option></select><button id="refresh">Refresh</button></div><p id="listStatus" role="status"></p><div class="grid" id="docsList"></div></section><section id="editorView"><div class="toolbar"><button id="back">← Docs</button><input id="title" aria-label="Document title" maxlength="200"><span id="status" role="status">Ready</span><button id="restore" hidden>Restore</button><button id="delete">Move to Trash</button></div><div class="toolbar card" style="margin-top:15px"><button data-format="bold"><b>B</b></button><button data-format="italic"><i>I</i></button><button data-format="underline"><u>U</u></button><button data-format="insertUnorderedList">• List</button><button data-format="insertOrderedList">1. List</button><button id="heading">Heading</button><button id="export">Export text</button></div><div class="editor" id="content" contenteditable="true" role="textbox" aria-label="Document editor" aria-multiline="true"></div><p id="error" role="alert"></p></section></div></main><script type="module" src="/docs-app.js"></script></body></html>
